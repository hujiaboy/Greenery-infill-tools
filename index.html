<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>浚鍵管理有限公司 - 補錄工具</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background-color: #f0f2f5; color: #333; }
        .card { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        h2 { text-align: center; font-size: 18px; margin: 0 0 12px 0; color: #1a365d; }
        .sub-title { text-align: center; font-size: 13px; color: #e67e22; margin-top: -8px; margin-bottom: 12px; font-weight: bold; }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: #4a5568; }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .row > div { flex: 1; min-width: 120px; }
        .btn-save { background-color: #e67e22; color: white; font-weight: bold; border: none; margin-top: 14px; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-copy { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-copy-yesterday { background-color: #2b6cb0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-export { background-color: #2f855a; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-del { background-color: #fed7d7; color: #9b2c2c; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-edit { background-color: #bee3f8; color: #2a69ac; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-nav { background-color: #e2e8f0; color: #2d3748; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; cursor: pointer; }
        .btn-mode { background-color: #4a5568; color: white; font-weight: bold; border: none; padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-mode.active { background-color: #e67e22; }
        .btn-search { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-clear { background-color: #a0aec0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        th { background-color: #edf2f7; color: #2d3748; cursor: pointer; user-select: none; }
        th:hover { background-color: #e2e8f0; }
        .summary { font-weight: bold; background-color: #feebc8; font-size: 13px; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .cloud-status { font-size: 11px; text-align: center; color: #2f855a; margin-top: -8px; margin-bottom: 8px; font-weight: bold; }
        .cloud-status.error { color: #e53e3e; }
        .nav-date { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .nav-date input { flex: 3; }
        .nav-date button { flex: 1; }
        .copy-section { background: #f7fafc; padding: 8px 12px; border-radius: 8px; margin-top: 4px; font-size: 13px; color: #4a5568; }
        .copy-section span { font-weight: bold; color: #2b6cb0; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .btn-group button { flex: 1; margin-top: 0; }
        .mode-indicator { text-align: center; font-size: 14px; font-weight: bold; padding: 6px; border-radius: 6px; margin-bottom: 8px; }
        .mode-indicator.edit { background: #e67e22; color: white; }
        .mode-indicator.view { background: #2b6cb0; color: white; }
        .hidden { display: none; }
        .range-selector { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .range-selector button { flex: 1; padding: 6px; background: #e2e8f0; border: none; font-weight: bold; color: #4a5568; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .range-selector button.active { background: #805ad5; color: white; }
        .salary-highlight { color: #e67e22; font-weight: bold; }
        .total-row { background-color: #fefcbf; font-weight: bold; }
        .remark-col { max-width: 100px; word-break: break-all; }
        .table-wrap { overflow-x: auto; }
        .rate-setting { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .rate-setting label { margin: 0; font-size: 13px; }
        .rate-setting input { width: 80px; margin: 0; }
        @media (max-width: 480px) {
            .row > div { min-width: 100%; }
            .nav-date input { flex: 2; }
            .nav-date button { flex: 1; }
            th, td { font-size: 10px; padding: 4px 1px; }
        }
    </style>
</head>
<body>

<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal;">📋 補錄工具 (修復版)</small></h2>
<div class="sub-title">🕒 手動輸入日期及時間 · 補錄歷史記錄</div>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<div class="card">
    <!-- 模式切換 -->
    <div class="row" style="margin-bottom:8px;">
        <div><button class="btn-mode active" id="modeEdit">✏️ 補錄模式</button></div>
        <div><button class="btn-mode" id="modeView">🔍 查閱模式</button></div>
    </div>
    <div id="modeIndicator" class="mode-indicator edit">✏️ 補錄模式 — 可新增及修改記錄</div>

    <!-- ====== 補錄模式 ====== -->
    <div id="editSection">
        <label style="color:#e67e22;">📅 選擇日期</label>
        <div class="nav-date">
            <button class="btn-nav" id="prevDay">◀ 前一日</button>
            <input type="date" id="recordDate">
            <button class="btn-nav" id="nextDay">後一日 ▶</button>
        </div>

        <div class="row">
            <div>
                <label>👤 司機姓名</label>
                <input type="text" id="driverName" placeholder="輸入司機姓名" autocomplete="off">
            </div>
            <div>
                <label>🔄 更次</label>
                <select id="shiftType">
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                </select>
            </div>
        </div>

        <div style="margin-top:4px;">
            <button class="btn-copy-yesterday" id="copyYesterdayBtn">📋 複製前一日相同司機</button>
        </div>

        <div class="row">
            <div>
                <label>⏰ 報到時間</label>
                <input type="time" id="checkInTime">
            </div>
            <div>
                <label>⏰ 簽退時間</label>
                <input type="time" id="checkOutTime">
            </div>
        </div>

        <div class="row">
            <div>
                <label>📝 備註 (可選)</label>
                <input type="text" id="remark" placeholder="例如：遲到、請假等">
            </div>
            <div>
                <label>💰 時薪 (HKD)</label>
                <input type="number" id="hourlyRate" min="1" step="0.5" value="75">
            </div>
        </div>

        <div class="copy-section">
            💡 <span>快速複製</span> — 點擊下方按鈕複製上一個記錄嘅司機名同更次，只需改時間
        </div>
        <div class="btn-group">
            <button class="btn-copy" id="copyLastBtn">📋 複製上一個記錄（司機+更次）</button>
            <button class="btn-clear" id="clearFormBtn">🗑️ 清空表單</button>
        </div>

        <button class="btn-save" id="saveBtn">💾 補錄此記錄</button>
    </div>

    <!-- ====== 查閱模式 ====== -->
    <div id="viewSection" class="hidden">
        <div style="text-align:center; padding:8px; background:#ebf8ff; border-radius:8px; margin-bottom:10px;">
            🔍 查閱模式 — 可按司機、日期範圍及更次查閱記錄
        </div>

        <div class="row">
            <div>
                <label>👤 司機姓名（可選）</label>
                <input type="text" id="viewDriverName" placeholder="留空顯示全部" autocomplete="off">
            </div>
            <div>
                <label>🔄 更次</label>
                <select id="viewShiftFilter">
                    <option value="ALL">全部</option>
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                </select>
            </div>
        </div>

        <label style="margin-top:8px;">📅 日期範圍</label>
        <div class="range-selector">
            <button id="vRangeDay" class="active">單日</button>
            <button id="vRangeMonth">月度</button>
            <button id="vRangeYear">年度</button>
        </div>

        <div id="vDayInput" style="margin-top:6px;">
            <input type="date" id="viewDayDate">
        </div>
        <div id="vMonthInput" class="hidden" style="margin-top:6px;">
            <input type="month" id="viewMonthDate">
        </div>
        <div id="vYearInput" class="hidden" style="margin-top:6px;">
            <input type="number" id="viewYearDate" placeholder="例如 2026" min="2020" max="2100">
        </div>

        <button class="btn-search" id="viewQueryBtn">🔎 查詢</button>
    </div>
</div>

<!-- ====== 結果顯示 ====== -->
<div class="card">
    <h3 style="margin:0 0 8px 0; font-size:15px;">📋 記錄</h3>
    <div class="table-wrap">
        <table id="resultTable">
            <thead>
                <tr>
                    <th data-sort="date">日期</th>
                    <th data-sort="shift">更次</th>
                    <th data-sort="driverName">司機</th>
                    <th data-sort="checkIn">報到</th>
                    <th data-sort="checkOut">簽退</th>
                    <th data-sort="hours">時數</th>
                    <th data-sort="salary">人工 (HKD)</th>
                    <th data-sort="remark">備註</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordBody">
                <tr><td colspan="9">暫無記錄</td></tr>
            </tbody>
        </table>
    </div>

    <div id="daySummary" class="summary">
        總記錄：0 條 | 總工時：0 小時 | 總人工：HK$0
    </div>

    <button class="btn-export" id="exportBtn">📊 匯出 CSV</button>
</div>

<script>
// ============================================================
// 應用程式主體 (使用 addEventListener 避免內聯綁定問題)
// ============================================================
const App = (function() {
    // ----- Firebase 配置 -----
    const firebaseConfig = {
        apiKey: "AIzaSyDCrtukTXfEQyJGsmPLH5Zzm0ECgtt8Zuc",
        authDomain: "driver-logs-on-for-duty.firebaseapp.com",
        databaseURL: "https://driver-logs-on-for-duty-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "driver-logs-on-for-duty",
        storageBucket: "driver-logs-on-for-duty.firebasestorage.app",
        messagingSenderId: "932386987991",
        appId: "1:932386987991:web:5728034c18000504feb592",
        measurementId: "G-JJYVPLPF54"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ----- 狀態 -----
    let state = {
        currentDate: '',
        currentDayData: {},
        activeListener: null,
        lastRecord: null,
        currentMode: 'edit',
        viewRange: 'day',
        viewResult: [],
        editingKey: null,
        sortConfig: { key: null, asc: true },
        hourlyRate: 75,
        isSaving: false,
    };

    // ----- DOM 快取 -----
    const $ = id => document.getElementById(id);
    const dom = {
        cloudStatus: $('cloudStatus'),
        recordDate: $('recordDate'),
        driverName: $('driverName'),
        shiftType: $('shiftType'),
        checkInTime: $('checkInTime'),
        checkOutTime: $('checkOutTime'),
        remark: $('remark'),
        hourlyRate: $('hourlyRate'),
        saveBtn: $('saveBtn'),
        recordBody: $('recordBody'),
        daySummary: $('daySummary'),
        modeIndicator: $('modeIndicator'),
        editSection: $('editSection'),
        viewSection: $('viewSection'),
        viewDriverName: $('viewDriverName'),
        viewShiftFilter: $('viewShiftFilter'),
        viewDayDate: $('viewDayDate'),
        viewMonthDate: $('viewMonthDate'),
        viewYearDate: $('viewYearDate'),
        vDayInput: $('vDayInput'),
        vMonthInput: $('vMonthInput'),
        vYearInput: $('vYearInput'),
        resultTable: $('resultTable'),
        modeEdit: $('modeEdit'),
        modeView: $('modeView'),
        prevDay: $('prevDay'),
        nextDay: $('nextDay'),
        copyYesterdayBtn: $('copyYesterdayBtn'),
        copyLastBtn: $('copyLastBtn'),
        clearFormBtn: $('clearFormBtn'),
        viewQueryBtn: $('viewQueryBtn'),
        exportBtn: $('exportBtn'),
        vRangeDay: $('vRangeDay'),
        vRangeMonth: $('vRangeMonth'),
        vRangeYear: $('vRangeYear'),
    };

    // ----- 輔助函數 -----
    function formatDate(d) { return d.toISOString().split('T')[0]; }
    function todayStr() { return formatDate(new Date()); }

    function showStatus(msg, isError = false) {
        dom.cloudStatus.textContent = msg;
        dom.cloudStatus.className = 'cloud-status' + (isError ? ' error' : '');
    }

    function showError(err) {
        console.error(err);
        showStatus('⚠️ 操作失敗：' + (err.message || err), true);
        alert('操作失敗：' + (err.message || err));
    }

    function calcHoursAndSalary(checkIn, checkOut, rate) {
        if (!checkIn || !checkOut) return { hours: 0, salary: 0 };
        const [h1, m1] = checkIn.split(':').map(Number);
        const [h2, m2] = checkOut.split(':').map(Number);
        let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (diff < 0) diff += 1440;
        const hours = Math.round((diff / 60) * 10) / 10;
        const salary = Math.round(hours * rate * 100) / 100;
        return { hours, salary };
    }

    function makeKey(driver, shift) { return driver + '_' + shift; }

    function loadHourlyRate() {
        const saved = localStorage.getItem('hourlyRate_backfill');
        if (saved) {
            const val = parseFloat(saved);
            if (!isNaN(val) && val > 0) {
                state.hourlyRate = val;
                dom.hourlyRate.value = val;
                return val;
            }
        }
        dom.hourlyRate.value = 75;
        state.hourlyRate = 75;
        return 75;
    }

    function saveHourlyRate(rate) {
        localStorage.setItem('hourlyRate_backfill', String(rate));
        state.hourlyRate = rate;
    }

    // ----- 核心功能 -----
    function setMode(mode) {
        state.currentMode = mode;
        dom.modeEdit.classList.toggle('active', mode === 'edit');
        dom.modeView.classList.toggle('active', mode === 'view');
        dom.editSection.classList.toggle('hidden', mode !== 'edit');
        dom.viewSection.classList.toggle('hidden', mode !== 'view');

        const indicator = dom.modeIndicator;
        if (mode === 'edit') {
            indicator.className = 'mode-indicator edit';
            indicator.innerText = '✏️ 補錄模式 — 可新增及修改記錄';
            // 切換回編輯時刷新當前日期
            switchDate();
        } else {
            indicator.className = 'mode-indicator view';
            indicator.innerText = '🔍 查閱模式 — 可按司機、日期範圍查閱記錄';
        }
        state.editingKey = null;
        dom.saveBtn.textContent = '💾 補錄此記錄';
    }

    function changeDate(delta) {
        const d = new Date(dom.recordDate.value);
        d.setDate(d.getDate() + delta);
        dom.recordDate.value = formatDate(d);
        switchDate();
    }

    function switchDate() {
        const date = dom.recordDate.value;
        if (!date) return;
        state.currentDate = date;
        // 移除舊監聽
        if (state.activeListener) {
            db.ref('attendance/' + date).off('value', state.activeListener);
            state.activeListener = null;
        }
        showStatus('☁️ 雲端狀態：資料同步中...');
        const listener = (snapshot) => {
            const data = snapshot.val();
            state.currentDayData = data || {};
            renderTable(data || {});
            showStatus('☁️ 雲端狀態：已連線');
        };
        state.activeListener = listener;
        db.ref('attendance/' + date).on('value', listener, (err) => {
            showError(err);
        });
        state.editingKey = null;
        dom.saveBtn.textContent = '💾 補錄此記錄';
    }

    function copyYesterday() {
        if (state.currentMode !== 'edit') {
            alert('請切換至「補錄模式」。');
            return;
        }
        const driverName = dom.driverName.value.trim();
        if (!driverName) { alert('請輸入司機姓名！'); return; }

        const dateObj = new Date(state.currentDate);
        dateObj.setDate(dateObj.getDate() - 1);
        const yesterday = formatDate(dateObj);

        db.ref('attendance/' + yesterday).once('value').then((snapshot) => {
            const data = snapshot.val();
            if (!data) { alert('前一日無記錄'); return; }

            const shifts = [];
            Object.keys(data).forEach(key => {
                if (data[key].driverName === driverName) {
                    shifts.push(data[key].shift);
                }
            });
            if (shifts.length === 0) {
                alert('前一日冇 ' + driverName + ' 嘅記錄');
                return;
            }
            let selectedShift = shifts[0];
            if (shifts.length > 1) {
                const choice = confirm('該司機前一日有 ' + shifts.join('、') + '，你想複製邊個？\n按「確定」複製第一個（' + shifts[0] + '），按「取消」複製第二個（' + shifts[1] + '）');
                if (!choice && shifts.length >= 2) {
                    selectedShift = shifts[1];
                }
            }
            dom.shiftType.value = selectedShift;
            alert('✅ 已複製 ' + driverName + ' 嘅更次設定為「' + selectedShift + '」');
            dom.checkInTime.focus();
        }).catch(showError);
    }

    function copyLastRecord() {
        if (state.currentMode !== 'edit') {
            alert('請切換至「補錄模式」。');
            return;
        }
        if (!state.lastRecord) { alert('未有記錄可複製'); return; }
        if (dom.driverName.value.trim() && !confirm('當前表單已有司機，確定要覆蓋嗎？')) return;
        dom.driverName.value = state.lastRecord.driverName;
        dom.shiftType.value = state.lastRecord.shift;
        dom.checkInTime.focus();
    }

    function clearForm() {
        dom.driverName.value = '';
        dom.checkInTime.value = '';
        dom.checkOutTime.value = '';
        dom.remark.value = '';
        state.editingKey = null;
        dom.saveBtn.textContent = '💾 補錄此記錄';
        dom.driverName.focus();
    }

    function saveRecord() {
        if (state.currentMode !== 'edit') {
            alert('請切換至「補錄模式」。');
            return;
        }
        if (state.isSaving) return;
        state.isSaving = true;
        dom.saveBtn.disabled = true;
        dom.saveBtn.textContent = '⏳ 儲存中...';

        try {
            const driverName = dom.driverName.value.trim();
            const shift = dom.shiftType.value;
            const checkIn = dom.checkInTime.value;
            const checkOut = dom.checkOutTime.value;
            const remark = dom.remark.value.trim();
            const rate = parseFloat(dom.hourlyRate.value) || state.hourlyRate;
            saveHourlyRate(rate);

            if (!driverName) { alert('請輸入司機姓名！'); return; }
            if (!state.currentDate) { alert('請選擇日期！'); return; }
            if (!checkIn) { alert('請輸入報到時間！'); return; }
            if (!checkOut) { alert('請輸入簽退時間！'); return; }

            const { hours, salary } = calcHoursAndSalary(checkIn, checkOut, rate);
            if (hours === 0) {
                alert('報到與簽退時間相同，工時為0，請確認時間是否正確。');
                return;
            }

            const key = makeKey(driverName, shift);
            if (state.editingKey !== key && state.currentDayData[key]) {
                if (!
