<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浚鍵管理有限公司 - 補錄工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background-color: #f0f2f5; color: #333; }
        .card { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        h2 { text-align: center; font-size: 18px; margin: 0 0 12px 0; color: #1a365d; }
        .sub-title { text-align: center; font-size: 13px; color: #e67e22; margin-top: -8px; margin-bottom: 12px; font-weight: bold; }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: #4a5568; }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; }
        select { background-color: white; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn-save { background-color: #e67e22; color: white; font-weight: bold; border: none; margin-top: 14px; cursor: pointer; }
        .btn-save:active { opacity: 0.8; }
        .btn-copy { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; cursor: pointer; }
        .btn-copy-yesterday { background-color: #2b6cb0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; cursor: pointer; }
        .btn-export { background-color: #2f855a; color: white; font-weight: bold; border: none; margin-top: 8px; cursor: pointer; }
        .btn-del { background-color: #fed7d7; color: #9b2c2c; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-nav { background-color: #e2e8f0; color: #2d3748; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; cursor: pointer; }
        .btn-mode { background-color: #4a5568; color: white; font-weight: bold; border: none; padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-mode.active { background-color: #e67e22; }
        .btn-mode.active-view { background-color: #2b6cb0; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        th { background-color: #edf2f7; color: #2d3748; }
        .summary { font-weight: bold; background-color: #feebc8; font-size: 13px; padding: 10px; border-radius: 6px; margin-top: 10px; text-align: center; }
        .cloud-status { font-size: 11px; text-align: center; color: #2f855a; margin-top: -8px; margin-bottom: 8px; font-weight: bold; }
        .nav-date { display: flex; gap: 8px; align-items: center; }
        .nav-date input { flex: 3; }
        .nav-date button { flex: 1; }
        .copy-section { background: #f7fafc; padding: 8px 12px; border-radius: 8px; margin-top: 4px; font-size: 13px; color: #4a5568; }
        .copy-section span { font-weight: bold; color: #2b6cb0; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; }
        .btn-group button { flex: 1; margin-top: 0; }
        .mode-indicator { text-align: center; font-size: 14px; font-weight: bold; padding: 6px; border-radius: 6px; margin-bottom: 8px; }
        .mode-indicator.edit { background: #e67e22; color: white; }
        .mode-indicator.view { background: #2b6cb0; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal;">📋 補錄工具</small></h2>
<div class="sub-title">🕒 手動輸入日期及時間 · 補錄歷史記錄</div>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<div class="card">
    <!-- 模式切換 -->
    <div class="row" style="margin-bottom:8px;">
        <div>
            <button class="btn-mode active" id="modeEdit" onclick="setMode('edit')">✏️ 補錄模式</button>
        </div>
        <div>
            <button class="btn-mode" id="modeView" onclick="setMode('view')">🔍 查閱模式</button>
        </div>
    </div>

    <!-- 模式指示器 -->
    <div id="modeIndicator" class="mode-indicator edit">✏️ 補錄模式 — 可新增及修改記錄</div>

    <!-- 日期選擇 + 快速導航 -->
    <label style="color:#e67e22;">📅 選擇日期</label>
    <div class="nav-date">
        <button class="btn-nav" onclick="changeDate(-1)">◀ 前一日</button>
        <input type="date" id="recordDate" onchange="switchDate()">
        <button class="btn-nav" onclick="changeDate(1)">後一日 ▶</button>
    </div>

    <!-- 補錄模式輸入區 -->
    <div id="editSection">
        <div class="row">
            <div>
                <label>司機姓名</label>
                <input type="text" id="driverName" placeholder="輸入司機姓名">
            </div>
            <div>
                <label>更次</label>
                <select id="shiftType">
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                </select>
            </div>
        </div>

        <div style="margin-top:4px;">
            <button class="btn-copy-yesterday" onclick="copyYesterday()">📋 複製前一日相同司機</button>
        </div>

        <div class="row">
            <div>
                <label>⏰ 報到時間</label>
                <input type="time" id="checkInTime">
            </div>
            <div>
                <label>⏰ 簽退時間</label>
                <input type="time" id="checkOutTime">
            </div>
        </div>

        <div class="copy-section">
            💡 <span>快速複製</span> — 點擊下方按鈕複製上一個記錄嘅司機名同更次，只需改時間
        </div>
        <div class="btn-group">
            <button class="btn-copy" onclick="copyLastRecord()">📋 複製上一個記錄（司機+更次）</button>
        </div>

        <button class="btn-save" id="btnSave" onclick="saveRecord()">💾 補錄此記錄</button>
    </div>

    <!-- 查閱模式提示 -->
    <div id="viewSection" class="hidden" style="text-align:center; padding:12px; background:#ebf8ff; border-radius:8px;">
        🔍 你現正處於 <strong>查閱模式</strong>，可以查看所選日期嘅所有已補錄記錄，並可刪除或匯出。
    </div>
</div>

<div class="card">
    <h3 style="margin:0 0 8px 0; font-size:15px;">📋 當日記錄</h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>司機</th>
                    <th>更次</th>
                    <th>報到</th>
                    <th>簽退</th>
                    <th>時數</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordBody">
                <tr><td colspan="6">暫無記錄</td></tr>
            </tbody>
        </table>
    </div>

    <div id="daySummary" class="summary">
        今日記錄：0 條
    </div>

    <button class="btn-export" onclick="exportDayCSV()">📊 匯出當日 CSV</button>
</div>

<script>
    // ============================================================
    // Supabase 設定
    // ============================================================
    const SUPABASE_URL = 'https://br-epic-sika-f177d5cf.supabase2.aidap-global.cn-beijing.volces.com';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjcyOTQ4OTIsInJvbGUiOiJhbm9uIn0.4ocpnifiPkDN2dRC7fbZQOgGYiII7ZXYR2NxW7P4486c';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 全域變數
    // ============================================================
    let currentDate = '';
    let currentDayRecords = [];
    let lastRecord = null;
    let currentMode = 'edit';

    // ============================================================
    // 初始化
    // ============================================================
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('recordDate').value = today;
        const savedShift = localStorage.getItem('rememberedShift_backfill') || '早更';
        document.getElementById('shiftType').value = savedShift;
        switchDate();
        setMode('edit');
    };

    document.getElementById('shiftType').addEventListener('change', function() {
        localStorage.setItem('rememberedShift_backfill', this.value);
    });

    // ============================================================
    // 模式切換
    // ============================================================
    function setMode(mode) {
        currentMode = mode;
        const editBtn = document.getElementById('modeEdit');
        const viewBtn = document.getElementById('modeView');
        const editSection = document.getElementById('editSection');
        const viewSection = document.getElementById('viewSection');
        const indicator = document.getElementById('modeIndicator');

        if (mode === 'edit') {
            editBtn.classList.add('active');
            editBtn.classList.remove('active-view');
            viewBtn.classList.remove('active');
            viewBtn.classList.remove('active-view');
            editSection.classList.remove('hidden');
            viewSection.classList.add('hidden');
            indicator.className = 'mode-indicator edit';
            indicator.innerText = '✏️ 補錄模式 — 可新增及修改記錄';
        } else {
            viewBtn.classList.add('active');
            viewBtn.classList.add('active-view');
            editBtn.classList.remove('active');
            editBtn.classList.remove('active-view');
            editSection.classList.add('hidden');
            viewSection.classList.remove('hidden');
            indicator.className = 'mode-indicator view';
            indicator.innerText = '🔍 查閱模式 — 只可查看、刪除及匯出記錄';
        }
    }

    // ============================================================
    // 日期切換
    // ============================================================
    function changeDate(delta) {
        const dateInput = document.getElementById('recordDate');
        const d = new Date(dateInput.value + 'T00:00:00');
        d.setDate(d.getDate() + delta);
        const newDate = d.toISOString().split('T')[0];
        dateInput.value = newDate;
        switchDate();
    }

    async function switchDate() {
        currentDate = document.getElementById('recordDate').value;
        if (!currentDate) return;

        setCloudStatus('資料同步中...');
        await fetchRecords();
    }

    // ============================================================
    // 獲取記錄
    // ============================================================
    async function fetchRecords() {
        try {
            const { data, error } = await supabase
                .from('attendance')
                .select('id, record_date, driver_name, shift, check_in, check_out, hours')
                .eq('record_date', currentDate)
                .order('check_in', { ascending: true });

            if (error) throw error;

            currentDayRecords = data || [];
            renderTable();
            setCloudStatus('已連線');
        } catch (err) {
            console.error(err);
            setCloudStatus('連線受阻，請檢查網絡');
        }
    }

    // ============================================================
    // 複製前一日相同司機
    // ============================================================
    async function copyYesterday() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        const driverName = document.getElementById('driverName').value.trim();
        if (!driverName) {
            alert('請先輸入要複製嘅司機姓名！');
            return;
        }

        const dateObj = new Date(currentDate + 'T00:00:00');
        dateObj.setDate(dateObj.getDate() - 1);
        const yesterday = dateObj.toISOString().split('T')[0];

        setCloudStatus('正在查詢前一日記錄...');

        try {
            const { data, error } = await supabase
                .from('attendance')
                .select('driver_name, shift, check_in, check_out')
                .eq('record_date', yesterday)
                .eq('driver_name', driverName)
                .order('check_in', { ascending: true });

            if (error) throw error;

            if (!data || data.length === 0) {
                alert('⚠️ 前一日 (' + yesterday + ') 無 ' + driverName + ' 嘅記錄');
                setCloudStatus('找不到該司機前一日記錄');
                return;
            }

            const lastShift = data[data.length - 1].shift;
            document.getElementById('shiftType').value = lastShift;
            localStorage.setItem('rememberedShift_backfill', lastShift);
            alert('✅ 已複製 ' + driverName + ' 嘅更次設定（' + lastShift + '）\n請手動輸入報到及簽退時間。');
            setCloudStatus('✅ 已複製前一日設定');
            document.getElementById('checkInTime').focus();
        } catch (err) {
            console.error(err);
            alert('⚠️ 讀取前一日記錄失敗，請檢查網絡');
        }
    }

    // ============================================================
    // 複製上一個記錄
    // ============================================================
    function copyLastRecord() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        if (!lastRecord) {
            alert('⚠️ 未有任何已補錄記錄可以複製，請先補錄一條記錄。');
            return;
        }
        document.getElementById('driverName').value = lastRecord.driver_name;
        document.getElementById('shiftType').value = lastRecord.shift;
        localStorage.setItem('rememberedShift_backfill', lastRecord.shift);
    }

    // ============================================================
    // 補錄記錄
    // ============================================================
    async function saveRecord() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        const driverName = document.getElementById('driverName').value.trim();
        const shift = document.getElementById('shiftType').value;
        const checkIn = document.getElementById('checkInTime').value;
        const checkOut = document.getElementById('checkOutTime').value;

        if (!driverName) { alert('請輸入司機姓名！'); return; }
        if (!currentDate) { alert('請先選擇日期！'); return; }
        if (!checkIn) { alert('請輸入報到時間！'); return; }
        if (!checkOut) { alert('請輸入簽退時間！'); return; }

        // 計算工時
        const [inH, inM] = checkIn.split(':').map(Number);
        const [outH, outM] = checkOut.split(':').map(Number);
        let diffMinutes = (outH * 60 + outM) - (inH * 60 + inM);
        if (diffMinutes < 0) diffMinutes += 1440;
        const hours = Math.round((diffMinutes / 60) * 10) / 10;

        const btnSave = document.getElementById('btnSave');
        btnSave.disabled = true;
        btnSave.textContent = '處理中...';

        try {
            // 先查詢是否已存在
            const { data: existing, error: queryError } = await supabase
                .from('attendance')
                .select('id')
                .eq('record_date', currentDate)
                .eq('driver_name', driverName)
                .eq('shift', shift)
                .maybeSingle();

            if (queryError) throw queryError;

            if (existing) {
                if (!confirm('⚠️ 該記錄已存在，確定要覆蓋嗎？')) {
                    btnSave.disabled = false;
                    btnSave.textContent = '💾 補錄此記錄';
                    return;
                }
                const { error } = await supabase
                    .from('attendance')
                    .update({ check_in: checkIn, check_out: checkOut, hours: hours, updated_at: new Date().toISOString() })
                    .eq('id', existing.id);

                if (error) throw error;
            } else {
                const { error } = await supabase
                    .from('attendance')
                    .insert({
                        record_date: currentDate,
                        driver_name: driverName,
                        shift: shift,
                        check_in: checkIn,
                        check_out: checkOut,
                        hours: hours
                    });

                if (error) throw error;
            }

            lastRecord = { driver_name: driverName, shift: shift };
            document.getElementById('checkInTime').value = '';
            document.getElementById('checkOutTime').value = '';
            setCloudStatus('✅ 補錄成功！');
            await fetchRecords();
            document.getElementById('checkInTime').focus();
        } catch (err) {
            console.error(err);
            alert('⚠️ 補錄失敗：' + err.message);
        } finally {
            btnSave.disabled = false;
            btnSave.textContent = '💾 補錄此記錄';
        }
    }

    // ============================================================
    // 刪除記錄
    // ============================================================
    async function deleteRecord(id, name) {
        if (!confirm('確定要刪除 ' + name + ' 嘅記錄嗎？')) return;

        try {
            const { error } = await supabase
                .from('attendance')
                .delete()
                .eq('id', id);

            if (error) throw error;

            setCloudStatus('🗑️ 已刪除');
            await fetchRecords();
        } catch (err) {
            console.error(err);
            alert('⚠️ 刪除失敗：' + err.message);
        }
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    function renderTable() {
        const tbody = document.getElementById('recordBody');
        tbody.innerHTML = '';

        if (currentDayRecords.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">暫無記錄</td></tr>';
            document.getElementById('daySummary').innerHTML = '今日記錄：0 條';
            return;
        }

        let totalHours = 0;
        currentDayRecords.forEach(r => {
            totalHours += parseFloat(r.hours || '0') || 0;
            const row = '<tr>' +
                '<td><strong>' + escapeHtml(r.driver_name) + '</strong></td>' +
                '<td>' + escapeHtml(r.shift) + '</td>' +
                '<td>' + escapeHtml(r.check_in || '-') + '</td>' +
                '<td>' + escapeHtml(r.check_out || '-') + '</td>' +
                '<td>' + (r.hours ? r.hours + 'h' : '-') + '</td>' +
                '<td><button class="btn-del" onclick="deleteRecord(' + r.id + ',\'' + escapeHtml(r.driver_name).replace(/'/g, "\\'") + '\')">刪除</button></td>' +
                '</tr>';
            tbody.innerHTML += row;
        });

        const totalRounded = Math.round(totalHours * 10) / 10;
        document.getElementById('daySummary').innerHTML =
            '<strong>今日記錄：' + currentDayRecords.length + ' 條</strong>' +
            (totalHours > 0 ? ' · 合計：' + totalRounded + ' 小時' : '');
    }

    // ============================================================
    // 匯出當日 CSV
    // ============================================================
    function exportDayCSV() {
        if (currentDayRecords.length === 0) {
            alert('當日沒有紀錄可匯出');
            return;
        }

        let csv = '\uFEFF日期,' + currentDate + '\n';
        csv += '司機,更次,報到時間,簽退時間,工作時數(h)\n';

        currentDayRecords.forEach(r => {
            csv += r.driver_name + ',' + r.shift + ',' + (r.check_in || '-') + ',' + (r.check_out || '-') + ',' + (r.hours || '0') + '\n';
        });

        downloadCSV(csv, '補錄記錄_' + currentDate + '.csv');
    }

    // ============================================================
    // 工具函數
    // ============================================================
    function downloadCSV(csv, fileName) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.create
