<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>浚鍵管理有限公司 - 補錄工具</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #cbd5e0;
            --table-header: #edf2f7;
            --summary-bg: #feebc8;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg: #1a202c;
            --card-bg: #2d3748;
            --text: #e2e8f0;
            --border: #4a5568;
            --table-header: #4a5568;
            --summary-bg: #553c1a;
            --input-bg: #4a5568;
            --shadow: rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 10px; background-color: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
        .card { background: var(--card-bg); padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px var(--shadow); margin-bottom: 12px; transition: background 0.3s; }
        h2 { text-align: center; font-size: 18px; margin: 0 0 8px 0; color: #1a365d; }
        .sub-title { text-align: center; font-size: 13px; color: #e67e22; margin: -6px 0 10px 0; font-weight: bold; }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: var(--text); }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--input-bg); color: var(--text); transition: background 0.3s, color 0.3s; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .row > div { flex: 1; min-width: 100px; }
        .btn-save { background-color: #e67e22; color: white; font-weight: bold; border: none; margin-top: 12px; }
        .btn-copy { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-copy-yesterday { background-color: #2b6cb0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-export { background-color: #2f855a; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-del { background-color: #fed7d7; color: #9b2c2c; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; width:auto; }
        .btn-edit { background-color: #bee3f8; color: #2a69ac; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; width:auto; }
        .btn-nav { background-color: #e2e8f0; color: #2d3748; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; cursor: pointer; }
        .btn-mode { background-color: #4a5568; color: white; font-weight: bold; border: none; padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer; flex:1; }
        .btn-mode.active { background-color: #e67e22; }
        .btn-search { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-refresh { background-color: #38a169; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-clear { background-color: #a0aec0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-excel { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-theme { background: transparent; border: none; font-size: 22px; cursor: pointer; width: auto; padding: 0 8px; }
        .btn-login { background-color: #4285f4; color: white; font-weight: bold; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; width: auto; }
        .btn-logout { background-color: #e53e3e; color: white; font-weight: bold; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; width: auto; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid var(--border); padding: 5px 2px; text-align: center; }
        th { background-color: var(--table-header); color: var(--text); }
        .summary { font-weight: bold; background-color: var(--summary-bg); font-size: 13px; padding: 8px; border-radius: 6px; margin-top: 10px; }
        .cloud-status { font-size: 11px; text-align: center; color: #2f855a; margin: -4px 0 8px 0; font-weight: bold; }
        .cloud-status.error { color: #e53e3e; }
        .hidden { display: none; }
        .range-selector { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .range-selector button { flex:1; padding:6px; background:#e2e8f0; border:none; font-weight:bold; border-radius:6px; font-size:12px; cursor:pointer; }
        .range-selector button.active { background:#805ad5; color:white; }
        .salary-highlight { color:#e67e22; font-weight:bold; }
        .table-wrap { overflow-x: auto; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-group button { flex:1; margin-top:0; }
        .mode-indicator { text-align:center; font-size:14px; font-weight:bold; padding:6px; border-radius:6px; margin-bottom:8px; }
        .mode-indicator.edit { background:#e67e22; color:white; }
        .mode-indicator.view { background:#2b6cb0; color:white; }
        .nav-date { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .nav-date input { flex:3; }
        .nav-date button { flex:1; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        @media (max-width:480px) {
            .row > div { min-width:100%; }
            .nav-date input { flex:2; }
            .nav-date button { flex:1; }
            th, td { font-size:10px; padding:3px 1px; }
            .header-flex { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body><div class="header-flex">
    <div>
        <h2 style="margin:0;">浚鍵管理有限公司<br><small style="font-size:14px;">📋 補錄工具 (長期監聽版)</small></h2>
        <div class="sub-title" style="margin-top:0;">🔄 自動更新 · 連線失敗會自動重試</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn-theme" id="themeToggle" onclick="toggleTheme()" title="切換主題">🌙</button>
        <div id="authSection">
            <button class="btn-login" id="loginBtn" onclick="loginWithGoogle()">🔑 Google 登入</button>
            <div id="userInfo" class="user-info hidden">
                <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                <span id="userName"></span>
                <button class="btn-logout" onclick="logout()">登出</button>
            </div>
        </div>
    </div>
</div>
<div class="cloud-status" id="cloudStatus">☁️ 狀態：連線中...</div><div class="card">
    <div class="row" style="margin-bottom:6px;">
        <div><button class="btn-mode active" id="modeEditBtn" onclick="setMode('edit')">✏️ 補錄</button></div>
        <div><button class="btn-mode" id="modeViewBtn" onclick="setMode('view')">🔍 查閱</button></div>
    </div>
    <div id="modeIndicator" class="mode-indicator edit">✏️ 補錄模式</div>

    <div id="editSection">
        <label>📅 日期</label>
        <div class="nav-date">
            <button class="btn-nav" onclick="changeDate(-1)">◀</button>
            <input type="date" id="recordDate" onchange="switchDate()">
            <button class="btn-nav" onclick="changeDate(1)">▶</button>
        </div>
        <button class="btn-refresh" onclick="forceRefresh()">🔄 手動重新整理</button>

        <div class="row">
            <div><label>👤 司機</label><input type="text" id="driverName" placeholder="姓名"></div>
            <div><label>🔄 更次</label>
                <select id="shiftType"><option value="早更">早更</option><option value="夜更">夜更</option></select>
            </div>
        </div>
        <div class="row">
            <div><label>⏰ 報到</label><input type="time" id="checkInTime"></div>
            <div><label>⏰ 簽退</label><input type="time" id="checkOutTime"></div>
        </div>
        <div class="row">
            <div><label>📝 備註</label><input type="text" id="remark" placeholder="可選"></div>
            <div><label>💰 時薪</label><input type="number" id="hourlyRate" value="75" step="0.5" min="1"></div>
        </div>

        <div class="btn-group">
            <button class="btn-copy-yesterday" onclick="copyYesterday()">📋 複製前一日</button>
            <button class="btn-copy" onclick="copyLastRecord()">📋 複製上一個</button>
            <button class="btn-clear" onclick="clearForm()">🗑️ 清空</button>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveRecord()">💾 補錄 / 更新</button>
    </div>

    <div id="viewSection" class="hidden">
        <div style="background:#ebf8ff; padding:8px; border-radius:8px; margin-bottom:10px; text-align:center;">🔍 查閱記錄</div>
        <div class="row">
            <div><label>👤 司機</label><input type="text" id="viewDriverName" placeholder="全部"></div>
            <div><label>🔄 更次</label>
                <select id="viewShiftFilter"><option value="ALL">全部</option><option value="早更">早更</option><option value="夜更">夜更</option></select>
            </div>
        </div>
        <label>📅 日期範圍</label>
        <div class="range-selector">
            <button id="vRangeDay" class="active" onclick="setViewRange('day')">單日</button>
            <button id="vRangeMonth" onclick="setViewRange('month')">月度</button>
            <button id="vRangeYear" onclick="setViewRange('year')">年度</button>
        </div>
        <div id="vDayInput"><input type="date" id="viewDayDate"></div>
        <div id="vMonthInput" class="hidden"><input type="month" id="viewMonthDate"></div>
        <div id="vYearInput" class="hidden"><input type="number" id="viewYearDate" placeholder="2026"></div>
        <button class="btn-search" onclick="viewQuery()">🔎 查詢</button>
    </div>
</div><div class="card">
    <h3 style="margin:0 0 6px 0; font-size:15px;">📋 記錄</h3>
    <div class="table-wrap">
        <table>
            <thead><tr><th>日期</th><th>更次</th><th>司機</th><th>報到</th><th>簽退</th><th>時數</th><th>人工</th><th>備註</th><th>操作</th></tr></thead>
            <tbody id="recordBody"><tr><td colspan="9">暫無記錄</td></tr></tbody>
        </table>
    </div>
    <div id="daySummary" class="summary">總記錄：0 | 總工時：0h | 總人工：HK$0</div>
    <button class="btn-export" onclick="exportCSV()">📊 匯出 CSV</button>
</div>

<div class="card">
    <h3 style="margin:0 0 6px 0; font-size:15px;">📊 豪華 Excel 匯出（按時間範圍）</h3>
    <div class="row">
        <div>
            <label>範圍類型</label>
            <select id="exportRange" onchange="toggleExportDate()">
                <option value="week">本週 (週一至日)</option>
                <option value="half1">上半月 (1-15)</option>
                <option value="half2">下半月 (16-月底)</option>
                <option value="month">全月</option>
                <option value="custom">自訂日期</option>
            </select>
        </div>
        <div id="exportDateRange" class="hidden">
            <label>開始</label><input type="date" id="exportStartDate">
            <label>結束</label><input type="date" id="exportEndDate">
        </div>
    </div>
    <button class="btn-excel" onclick="exportDeluxeExcel()" style="background:#805ad5;">📊 匯出豪華 Excel</button>
</div><script>
const firebaseConfig = {
    apiKey: "AIzaSyBB3ZVmlaMutVlRccnPy1NB4Xd2NqTc4H8",
    authDomain: "greenery-infill-tools.firebaseapp.com",
    databaseURL: "https://greenery-infill-tools-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "greenery-infill-tools",
    storageBucket: "greenery-infill-tools.firebasestorage.app",
    messagingSenderId: "209221561686",
    appId: "1:209221561686:web:2b812b1da3fa9bc4b1baf7",
    measurementId: "G-PGVPCG7LER"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', next);
}
function loadTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}

function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => alert('登入失敗: ' + err.message));
}
function logout() { auth.signOut(); }
function updateAuthUI(user) {
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');
    if (user) {
        loginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        document.getElementById('userAvatar').src = user.photoURL || '';
        document.getElementById('userName').textContent = user.displayName || user.email;
    } else {
        loginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
    }
}
auth.onAuthStateChanged(user => updateAuthUI(user));

let currentDate = '';
let currentDayData = {};
let lastRecord = null;
let editingKey = null;
let currentMode = 'edit';
let viewRange = 'day';
let viewResult = [];
let hourlyRate = 75;
let listenerRef = null;
let isListening = false;

function $(id) { return document.getElementById(id); }
function today() { return new Date().toISOString().split('T')[0]; }
function showStatus(msg, err = false) {
    const el = $('cloudStatus');
    el.textContent = msg;
    el.className = 'cloud-status' + (err ? ' error' : '');
}
function makeKey(driver, shift) { return driver + '_' + shift; }
function calcHours(checkIn, checkOut) {
    if (!checkIn || !checkOut) return { hours: 0, salary: 0 };
    const [h1, m1] = checkIn.split(':').map(Number);
    const [h2, m2] = checkOut.split(':').map(Number);
    let diff = (h2*60 + m2) - (h1*60 + m1);
    if (diff < 0) diff += 1440;
    const hours = Math.round((diff/60)*10)/10;
    const salary = Math.round(hours * hourlyRate * 100) / 100;
    return { hours, salary };
}
function loadHourlyRate() {
    const saved = localStorage.getItem('hourlyRate_backfill');
    if (saved) { const v=parseFloat(saved); if(!isNaN(v)&&v>0) hourlyRate=v; }
    $('hourlyRate').value = hourlyRate;
}
$('hourlyRate').addEventListener('change', function() {
    const v=parseFloat(this.value);
    if(!isNaN(v)&&v>0) { hourlyRate=v; localStorage.setItem('hourlyRate_backfill', String(v)); }
});
const savedShift = localStorage.getItem('rememberedShift_backfill') || '早更';
$('shiftType').value = savedShift;
$('shiftType').addEventListener('change', function() {
    localStorage.setItem('rememberedShift_backfill', this.value);
});function setMode(mode) {
    currentMode = mode;
    $('modeEditBtn').classList.toggle('active', mode==='edit');
    $('modeViewBtn').classList.toggle('active', mode==='view');
    $('editSection').classList.toggle('hidden', mode!=='edit');
    $('viewSection').classList.toggle('hidden', mode!=='view');
    const ind = $('modeIndicator');
    if (mode==='edit') {
        ind.className='mode-indicator edit';
        ind.innerText='✏️ 補錄模式 (自動更新)';
        switchDate();
    } else {
        ind.className='mode-indicator view';
        ind.innerText='🔍 查閱模式';
        stopListening();
    }
    editingKey = null;
    $('saveBtn').textContent = '💾 補錄此記錄';
}

function startListening(date) {
    stopListening();
    if (!date) return;
    currentDate = date;
    showStatus('☁️ 連線中...');
    const ref = db.ref('attendance/' + date);
    listenerRef = ref;
    isListening = true;
    ref.on('value', (snapshot) => {
        if (!isListening) return;
        const data = snapshot.val();
        currentDayData = data || {};
        renderTable(currentDayData);
        showStatus('☁️ 已連線 · 自動更新中');
    }, (error) => {
        showStatus('⚠️ 連線中斷: ' + error.message, true);
        setTimeout(() => {
            if (isListening) {
                showStatus('☁️ 重新連線中...');
                startListening(currentDate);
            }
        }, 5000);
    });
}
function stopListening() {
    if (listenerRef) {
        listenerRef.off('value');
        listenerRef = null;
    }
    isListening = false;
}
function switchDate() {
    const date = $('recordDate').value;
    if (!date) return;
    currentDate = date;
    startListening(date);
}
function forceRefresh() {
    if (currentDate) startListening(currentDate);
    else switchDate();
}
function changeDate(delta) {
    const d = new Date($('recordDate').value);
    d.setDate(d.getDate() + delta);
    $('recordDate').value = d.toISOString().split('T')[0];
    switchDate();
}function copyYesterday() {
    if (currentMode!=='edit') { alert('請轉補錄模式'); return; }
    const driver = $('driverName').value.trim();
    if (!driver) { alert('請輸入司機姓名'); return; }
    const d = new Date(currentDate);
    d.setDate(d.getDate()-1);
    const yest = d.toISOString().split('T')[0];
    db.ref('attendance/' + yest).once('value').then(snap => {
        const data = snap.val();
        if (!data) { alert('前一日無記錄'); return; }
        let shifts = [];
        Object.keys(data).forEach(k => {
            if (data[k].driverName === driver) shifts.push(data[k].shift);
        });
        if (!shifts.length) { alert('前一日冇 ' + driver + ' 嘅記錄'); return; }
        let sel = shifts[0];
        if (shifts.length > 1) {
            if (!confirm('佢有 ' + shifts.join('、') + '，複製第一個（' + shifts[0] + '）？\n按取消可選第二個（' + shifts[1] + '）')) {
                if (shifts.length >= 2) sel = shifts[1];
            }
        }
        $('shiftType').value = sel;
        alert('已複製更次為「' + sel + '」');
        $('checkInTime').focus();
    }).catch(err => alert('錯誤: ' + err.message));
}

function copyLastRecord() {
    if (currentMode!=='edit') { alert('請轉補錄模式'); return; }
    if (!lastRecord) { alert('未有記錄可複製'); return; }
    if ($('driverName').value.trim() && !confirm('覆蓋當前司機？')) return;
    $('driverName').value = lastRecord.driverName;
    $('shiftType').value = lastRecord.shift;
    $('checkInTime').focus();
}

function clearForm() {
    $('driverName').value = '';
    $('checkInTime').value = '';
    $('checkOutTime').value = '';
    $('remark').value = '';
    editingKey = null;
    $('saveBtn').textContent = '💾 補錄此記錄';
    $('driverName').focus();
}

function saveRecord() {
    if (currentMode!=='edit') { alert('請轉補錄模式'); return; }
    const driver = $('driverName').value.trim();
    const shift = $('shiftType').value;
    const checkIn = $('checkInTime').value;
    const checkOut = $('checkOutTime').value;
    const remark = $('remark').value.trim();
    if (!driver) { alert('請輸入司機姓名'); return; }
    if (!checkIn) { alert('請輸入報到時間'); return; }
    if (!checkOut) { alert('請輸入簽退時間'); return; }
    const { hours, salary } = calcHours(checkIn, checkOut);
    if (hours === 0) { alert('工時為0，請檢查時間'); return; }
    const key = makeKey(driver, shift);
    if (editingKey !== key && currentDayData[key]) {
        if (!confirm('記錄已存在，要覆蓋嗎？')) return;
    }
    const record = { driverName: driver, shift, checkIn, checkOut, hours, salary, remark };
    const ref = db.ref('attendance/' + currentDate + '/' + key);
    const btn = $('saveBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 儲存中...';
    ref.set(record).then(() => {
        lastRecord = { driverName: driver, shift };
        $('checkInTime').value = '';
        $('checkOutTime').value = '';
        $('remark').value = '';
        editingKey = null;
        btn.textContent = '💾 補錄此記錄';
        showStatus('✅ 儲存成功！');
    }).catch(err => {
        alert('儲存失敗: ' + err.message);
        showStatus('⚠️ 儲存失敗', true);
    }).finally(() => {
        btn.disabled = false;
        if (btn.textContent === '⏳ 儲存中...') btn.textContent = '💾 補錄此記錄';
    });
}

function deleteRecord(key) {
    if (!confirm('刪除 ' + key + ' ？')) return;
    db.ref('attendance/' + currentDate + '/' + key).remove()
        .catch(err => alert('刪除失敗: ' + err.message));
}
function editRecord(key) {
    if (currentMode!=='edit') { alert('請轉補錄模式'); return; }
    const r = currentDayData[key];
    if (!r) { alert('記錄不存在'); return; }
    $('driverName').value = r.driverName;
    $('shiftType').value = r.shift;
    $('checkInTime').value = r.checkIn || '';
    $('checkOutTime').value = r.checkOut || '';
    $('remark').value = r.remark || '';
    editingKey = key;
    $('saveBtn').textContent = '🔄 更新記錄';
    $('editSection').scrollIntoView({ behavior: 'smooth' });
}function renderTable(data) {
    const tbody = $('recordBody');
    const keys = Object.keys(data || {});
    let html = '';
    if (!keys.length) {
        html = '<tr><td colspan="9">暫無記錄</td></tr>';
    } else {
        let totalHours = 0, totalSalary = 0;
        keys.forEach(k => {
            const r = data[k];
            totalHours += r.hours || 0;
            totalSalary += r.salary || 0;
            html += `<tr>
                <td>${currentDate}</td>
                <td>${r.shift}</td>
                <td><strong>${r.driverName}</strong></td>
                <td>${r.checkIn || '-'}</td>
                <td>${r.checkOut || '-'}</td>
                <td>${r.hours ? r.hours+'h' : '-'}</td>
                <td class="salary-highlight">${r.salary ? 'HK$'+r.salary.toFixed(2) : '-'}</td>
                <td>${r.remark || ''}</td>
                <td>
                    <button class="btn-edit" onclick="editRecord('${k}')">✏️</button>
                    <button class="btn-del" onclick="deleteRecord('${k}')">🗑️</button>
                </td>
            </tr>`;
        });
        $('daySummary').innerHTML = `<strong>總記錄：${keys.length} 條 | 總工時：${totalHours.toFixed(1)}h | 總人工：HK$${totalSalary.toFixed(2)}</strong>`;
    }
    tbody.innerHTML = html;
}

function setViewRange(range) {
    viewRange = range;
    document.querySelectorAll('.range-selector button').forEach(b => b.classList.remove('active'));
    document.getElementById('vRange' + range.charAt(0).toUpperCase() + range.slice(1)).classList.add('active');
    $('vDayInput').classList.toggle('hidden', range!=='day');
    $('vMonthInput').classList.toggle('hidden', range!=='month');
    $('vYearInput').classList.toggle('hidden', range!=='year');
}

function viewQuery() {
    const driver = $('viewDriverName').value.trim();
    const shiftFilter = $('viewShiftFilter').value;
    let start, end;
    if (viewRange === 'day') {
        const d = $('viewDayDate').value;
        if (!d) { alert('請選擇日期'); return; }
        start = end = d;
    } else if (viewRange === 'month') {
        const m = $('viewMonthDate').value;
        if (!m) { alert('請選擇月份'); return; }
        start = m + '-01';
        const last = new Date(parseInt(m.split('-')[0]), parseInt(m.split('-')[1]), 0).getDate();
        end = m + '-' + String(last).padStart(2,'0');
    } else {
        const y = $('viewYearDate').value;
        if (!y) { alert('請輸入年份'); return; }
        start = y + '-01-01';
        end = y + '-12-31';
    }
    showStatus('☁️ 查詢中...');
    db.ref('attendance').once('value').then(snap => {
        const all = snap.val() || {};
        const dates = Object.keys(all).filter(d => d>=start && d<=end).sort();
        const results = [];
        dates.forEach(d => {
            const day = all[d];
            Object.keys(day).forEach(k => {
                const r = day[k];
                if (driver && r.driverName !== driver) return;
                if (shiftFilter !== 'ALL' && r.shift !== shiftFilter) return;
                results.push({
                    date: d, key: k,
                    shift: r.shift,
                    driverName: r.driverName,
                    checkIn: r.checkIn || '-',
                    checkOut: r.checkOut || '-',
                    hours: r.hours || 0,
                    salary: r.salary || 0,
                    remark: r.remark || ''
                });
            });
        });
        viewResult = results;
        let html = '';
        if (!results.length) {
            html = `<tr><td colspan="9">無符合記錄</td></tr>`;
            $('daySummary').innerHTML = '查詢結果：無資料';
        } else {
            let th=0, ts=0;
            results.forEach(r => {
                th += r.hours; ts += r.salary;
                html += `<tr>
                    <td>${r.date}</td>
                    <td>${r.shift}</td>
                    <td><strong>${r.driverName}</strong></td>
                    <td>${r.checkIn}</td>
                    <td>${r.checkOut}</td>
                    <td>${r.hours ? r.hours+'h' : '-'}</td>
                    <td class="salary-highlight">${r.salary ? 'HK$'+r.salary.toFixed(2) : '-'}</td>
                    <td>${r.remark}</td>
                    <td><button class="btn-del" onclick="viewDeleteRecord('${r.date}','${r.key}')">刪除</button></td>
                </tr>`;
            });
            const display = driver || '所有司機';
            $('daySummary').innerHTML = `<strong>${start} 至 ${end}</strong> 司機：${display} | 記錄：${results.length} | 工時：${th.toFixed(1)}h | 人工：HK$${ts.toFixed(2)}`;
        }
        $('recordBody').innerHTML = html;
        showStatus('✅ 查詢完成');
    }).catch(err => {
        alert('查詢失敗: ' + err.message);
        showStatus('⚠️ 查詢失敗', true);
    });
}
function viewDeleteRecord(date, key) {
    if (!confirm('刪除 ' + key + ' ？')) return;
    db.ref('attendance/' + date + '/' + key).remove()
        .then(() => viewQuery())
        .catch(err => alert('刪除失敗: ' + err.message));
}function exportCSV() {
    let data = [], title = '';
    if (currentMode === 'edit') {
        const keys = Object.keys(currentDayData);
        if (!keys.length) { alert('無記錄可匯出'); return; }
        keys.forEach(k => {
            const r = currentDayData[k];
            data.push({
                date: currentDate,
                shift: r.shift,
                driverName: r.driverName,
                checkIn: r.checkIn || '-',
                checkOut: r.checkOut || '-',
                hours: r.hours || 0,
                salary: r.salary || 0,
                remark: r.remark || ''
            });
        });
        title = '補錄_' + currentDate;
    } else {
        if (!viewResult.length) { alert('請先查詢'); return; }
        data = viewResult;
        const driver = $('viewDriverName').value.trim() || '全部';
        title = '查詢_' + driver;
    }
    let csv = '\uFEFF日期,更次,司機,報到,簽退,時數,人工,備註\n';
    let th=0, ts=0;
    data.forEach(r => {
        th += r.hours; ts += r.salary;
        csv += `${r.date},${r.shift},${r.driverName},${r.checkIn},${r.checkOut},${r.hours},${r.salary.toFixed(2)},"${r.remark}"\n`;
    });
    csv += `總計,,,,,,${th.toFixed(1)},${ts.toFixed(2)},\n`;
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = title + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function toggleExportDate() {
    const val = $('exportRange').value;
    $('exportDateRange').classList.toggle('hidden', val !== 'custom');
}

function getExportDateRange() {
    const range = $('exportRange').value;
    const today = new Date();
    let start, end;
    if (range === 'week') {
        const day = today.getDay();
        const diff = today.getDate() - day + (day === 0 ? -6 : 1);
        start = new Date(today.getFullYear(), today.getMonth(), diff);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'half1') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth(), 15);
    } else if (range === 'half2') {
        start = new Date(today.getFullYear(), today.getMonth(), 16);
        const lastDay = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
        end = new Date(today.getFullYear(), today.getMonth(), lastDay);
    } else if (range === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth()+1, 0);
    } else {
        const s = $('exportStartDate').value;
        const e = $('exportEndDate').value;
        if (!s || !e) { alert('請選擇自訂日期範圍'); return null; }
        start = new Date(s + 'T00:00:00');
        end = new Date(e + 'T23:59:59');
    }
    const format = d => d.toISOString().split('T')[0];
    return { start: format(start), end: format(end), startObj: start, endObj: end };
}async function exportDeluxeExcel() {
    const range = getExportDateRange();
    if (!range) return;
    const { start, end } = range;
    showStatus('☁️ 讀取資料中...');
    const snap = await db.ref('attendance').once('value').catch(err => {
        alert('讀取失敗: ' + err.message);
        return null;
    });
    if (!snap) return;
    const all = snap.val() || {};
    const dates = Object.keys(all).filter(d => d >= start && d <= end).sort();
    if (!dates.length) {
        alert('所選範圍內無任何記錄！');
        showStatus('⚠️ 無資料', true);
        return;
    }
    const records = [];
    dates.forEach(date => {
        const dayData = all[date];
        Object.keys(dayData).forEach(key => {
            const r = dayData[key];
            records.push({
                date, shift: r.shift, driverName: r.driverName,
                checkIn: r.checkIn || '-', checkOut: r.checkOut || '-',
                hours: r.hours || 0, salary: r.salary || 0,
                remark: r.remark || ''
            });
        });
    });
    let totalHours = 0, totalSalary = 0;
    const driverSummary = {};
    records.forEach(r => {
        totalHours += r.hours; totalSalary += r.salary;
        if (!driverSummary[r.driverName]) driverSummary[r.driverName] = { hours: 0, salary: 0 };
        driverSummary[r.driverName].hours += r.hours;
        driverSummary[r.driverName].salary += r.salary;
    });
    const workbook = new ExcelJS.Workbook();
    workbook.creator = '浚鍵管理有限公司';
    workbook.created = new Date();
    const ws1 = workbook.addWorksheet('財務摘要', { views: [{ state: 'frozen', ySplit: 5 }] });
    const titleRow = ws1.addRow(['浚鍵管理有限公司 - 工時與薪資總表']);
    ws1.mergeCells(`A${titleRow.number}:F${titleRow.number}`);
    const titleCell = titleRow.getCell(1);
    titleCell.font = { size: 18, bold: true, color: { argb: 'FFFFFFFF' } };
    titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
    ws1.getRow(titleRow.number).height = 40;
    const periodRow = ws1.addRow([`統計週期：${start} 至 ${end}`]);
    ws1.mergeCells(`A${periodRow.number}:F${periodRow.number}`);
    periodRow.getCell(1).font = { size: 12, bold: true, color: { argb: 'FF334155' } };
    periodRow.getCell(1).alignment = { horizontal: 'center' };
    ws1.getRow(periodRow.number).height = 25;
    ws1.addRow([]);
    const infoHeader = ws1.addRow(['總記錄數', '總工時 (h)', '總薪資 (HKD)']);
    infoHeader.eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4A5568' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
    });
    const infoRow = ws1.addRow([records.length, totalHours.toFixed(1), totalSalary.toFixed(2)]);
    infoRow.eachCell(cell => {
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.font = { bold: true };
        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
    });
    ws1.addRow([]);
    const sumHeader = ws1.addRow(['司機', '總工時 (h)', '總薪資 (HKD)']);
    sumHeader.eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2B6CB0' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
    });
    Object.keys(driverSummary).sort().forEach(name => {
        const d = driverSummary[name];
        const row = ws1.addRow([name, d.hours.toFixed(1), d.salary.toFixed(2)]);
        row.eachCell(cell => {
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
            cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
        });
    });
    ws1.getColumn(1).width = 18; ws1.getColumn(2).width = 18; ws1.getColumn(3).width = 18;
    const ws2 = workbook.addWorksheet('明細表', { views: [{ state: 'frozen', ySplit: 1 }] });
    const headers = ['日期', '更次', '司機', '報到', '簽退', '時數 (h)', '薪資 (HKD)', '備註'];
    const headerRow2 = ws2.addRow(headers);
    headerRow2.eachCell(cell => {
        cell.font = { bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
    });
    ws2.getRow(headerRow2.number).height = 28;
    records.forEach(r => {
        const row = ws2.addRow([r.date, r.shift, r.driverName, r.checkIn, r.checkOut, r.hours, r.salary, r.remark]);
        row.eachCell((cell, col) => {
            cell.alignment = { horizontal: col === 6 ? 'right' : 'left', vertical: 'middle' };
            cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
            if (col === 6) cell.font = { bold: true, color: { argb: 'FF2F855A' } };
        });
    });
    ws2.getColumn(1).width = 14; ws2.getColumn(2).width = 10; ws2.getColumn(3).width = 14;
    ws2.getColumn(4).width = 12; ws2.getColumn(5).width = 12; ws2.getColumn(6).width = 12;
    ws2.getColumn(7).width = 16; ws2.getColumn(8).width = 24;
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `工時報表_${start}_至_${end}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showStatus('✅ 豪華 Excel 匯出成功！');
}

window.onload = function() {
    loadTheme();
    const todayStr = today();
    $('recordDate').value = todayStr;
    $('viewDayDate').value = todayStr;
    $('viewMonthDate').value = todayStr.substring(0,7);
    $('viewYearDate').value = todayStr.substring(0,4);
    loadHourlyRate();
    setMode('edit');
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
    const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0);
    $('exportStartDate').value = firstDay.toISOString().split('T')[0];
    $('exportEndDate').value = lastDay.toISOString().split('T')[0];
};
